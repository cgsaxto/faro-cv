name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-core:
    name: Python Engine & API (Lint, Strict Types, Tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch, FastAPI, and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[all]"

      - name: Lint & format check (ruff)
        run: |
          ruff check src tests experiments
          ruff format --check src tests experiments

      - name: Static type check (mypy --strict)
        run: mypy src tests experiments

      - name: Run test suite with coverage
        run: pytest --cov=faro_cv --cov-report=term-missing

  web-workbench:
    name: Next.js Workbench (Typecheck & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

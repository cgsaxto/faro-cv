[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "faro-cv"
version = "0.1.0"
description = "Interactive adversarial attack, SVD/2D-FFT signal purification, and FSM-governed computer vision robustness workbench."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Faro-CV Maintainers" }]
keywords = [
    "adversarial-robustness",
    "computer-vision",
    "svd",
    "fft",
    "signal-processing",
    "finite-state-machine",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.4",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
]
api = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
all = [
    "faro-cv[ml,api,dev]",
]

[project.urls]
Homepage = "https://github.com/your-username/faro-cv"
Repository = "https://github.com/your-username/faro-cv"
Issues = "https://github.com/your-username/faro-cv/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/faro_cv"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["faro_cv"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torch", "torchvision"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests requiring model weights or extended optimization loops",
    "mps: tests specifically validating Apple Silicon MPS execution",
]

[tool.coverage.run]
source = ["src/faro_cv"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
